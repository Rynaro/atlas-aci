decisions:
  D1:
    summary: "schema-epoch-namespaced DB path .atlas/graph.<int-epoch>.db; no ALTER ladder; EXPECTED_DDL_HASH paired with epoch; sweep/rebuild index-path only; serve fails fast read-only; atomic-rename single-writer"
    criteria: ["AC-H-9", "AC-H-10", "AC-H-11", "AC-H-12", "AC-H-16", "AC-H-17", "AC-A1-9"]
    reversal_condition: "if non-derived data is stored in the DB, the cache premise breaks and a real ALTER ladder is needed; also revisit if full-reindex time on the largest supported repo exceeds an operationally tolerable ceiling"
  D2:
    summary: "central bounds chokepoint in _call_tool (element-cap + byte-ceiling via _bounded_field registry); truncate-and-flag; hard-fail only at the absolute byte-ceiling"
    criteria: ["AC-H-3", "AC-H-4", "AC-H-5", "AC-H-6", "AC-H-7", "AC-H-8", "AC-H-15", "AC-H-18"]
    reversal_condition: "if a consumer corrupts on flagged partial results, switch that path to hard-fail; if the central gate cannot introspect a response shape, mandate per-tool caps plus a test asserting every registered tool calls a cap helper"
  D3:
    summary: "degree-centrality god nodes (A2, zero-dep) ship first; hand-rolled deterministic LPA communities (A3, zero-dep, total-ordered); both over the confident subgraph (EXTRACTED union INFERRED, AMBIGUOUS excluded - D4a); networkx rejected absolutely (probe-time-only in an ephemeral env)"
    criteria: ["AC-A2-1", "AC-A2-2", "AC-A2-3", "AC-A3-1", "AC-A3-2", "AC-A3-3", "AC-A3-4", "AC-A3-5", "AC-NEG-2", "AC-NEG-7"]
    probe_required: true
    threshold: "D3a pre-registered per-repo rule (frozen before the probe runs, anti-circular): pass iff Louvain_Q_median>=Q_struct AND LPA_Q>=Q_struct AND LPA_Q>=R*Louvain_Q_median, with Q_struct=0.30, R=0.85, Louvain baseline=median of K=10 networkx louvain_communities at seeds 0..9 gamma=1.0, LPA=shipped single deterministic run, both over the confident-subgraph undirected unweighted projection; evaluated independently on solidusio/solidus@4026945d614e81383c007ed1ab1278a0195ce5d9 AND spree/spree@6699cde44303ea85ef6e56c5e87c44a738ab73fc, never averaged"
    reversal_condition: "DIR-1 (amended): if EITHER pinned repo fails ANY clause, A3 communities are CUT from v2.0.0 and deferred to v2.1 (ship A2 only); networkx/Louvain is NEVER adopted (the original networkx flip is deleted); a source-verified-structured repo failing the Louvain precondition is a construction FAIL that cuts A3, not a repo swap; R moves within [0.80,0.90] only on an explicit maintainer brand-vs-quality weight"
  D4:
    summary: "deterministic 3-value confidence enum {EXTRACTED, INFERRED, AMBIGUOUS} partitioned on candidate count; zero candidates = no edge; AMBIGUOUS carries ordered candidates[]; no LLM producer; per-language type-qualified rule pinned; D4a: AMBIGUOUS is excluded from the A2/A3/probe analysis graph but still stored and returned by graph_query (AC-A2-3 visibility, AC-NEG-7, AC-A1-10 divergence) - an analysis-time filter, not a drop"
    criteria: ["AC-A1-1", "AC-A1-2", "AC-A1-3", "AC-A1-4", "AC-A1-5", "AC-A1-6", "AC-A1-7", "AC-A1-8", "AC-A1-10", "AC-A1-11", "AC-NEG-3"]
    reversal_condition: "if AMBIGUOUS edges are ignored into noise, revert toward the silent guard or an opt-in tier; if over-trusted despite the tag, require an explicit opt-in flag to receive AMBIGUOUS edges"
  D5:
    summary: "rationale nodes for CODE languages only, Ruby->Python->JS/TS (store DDL in H3 substrate, separate from edge table); silent-dead-language honesty fix (LANG_BY_EXT<->QUERIES + visible skip report)"
    criteria: ["AC-A4-1", "AC-A4-2", "AC-A4-3", "AC-A4-4", "AC-A4-5", "AC-A4-6", "AC-H-13", "AC-H-14"]
    reversal_condition: "if the userbase shifts polyglot/Go/Rust-heavy, upgrade the honesty fix to real query coverage and extend rationale to those languages; if ADR/RFC-in-Ruby/Python proves high-value, promote it to must-have"
  D6:
    summary: "normalized sorted canonical JSONL export (relative-path keys, header record, byte-deterministic by construction); no graph/union merge driver, trivial regenerate-on-conflict permitted; record-level total order + sorted file iteration"
    criteria: ["AC-A5-1", "AC-A5-2", "AC-A5-3", "AC-A5-4", "AC-A5-5", "AC-A5-6", "AC-A5-7", "AC-A5-8", "AC-REL-1", "AC-REL-2"]
    reversal_condition: "if regeneration is too slow as a conflict resolver, add a record-level (not union) driver; if JSONL exceeds 100 MB (104857600 bytes), add compression/sharding; cross-platform byte-determinism unmet is a RELEASE BLOCKER to fix, not a reversal"

