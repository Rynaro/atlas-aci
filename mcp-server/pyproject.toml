[project]
name = "atlas-aci"
version = "0.2.2"
description = "ATLAS bounded Agent-Computer Interface — reference MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

dependencies = [
  "mcp>=1.2.0",
  "tree-sitter>=0.23",
  # 1.6.3 ships only a `_native/` subpackage and removed the top-level
  # `tree_sitter_language_pack` module that codegraph.py imports.
  "tree-sitter-language-pack>=0.3,<1.6.3",
  "click>=8.1",
  "pydantic>=2.6",
  "structlog>=24.1",
]

[project.optional-dependencies]
ruby = [
  # prism-rb is invoked via subprocess; install separately:
  # gem install prism
]
vec = [
  "sqlite-vec>=0.1.3",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
atlas-aci = "atlas_aci.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_aci"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
