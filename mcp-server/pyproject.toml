[project]
name = "atlas-aci"
version = "0.4.0"
description = "ATLAS bounded Agent-Computer Interface — reference MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

dependencies = [
  "mcp>=1.2.0",
  "tree-sitter>=0.23",
  # 1.6.3 ships only a `_native/` subpackage and removed the top-level
  # `tree_sitter_language_pack` module that codegraph.py imports.
  "tree-sitter-language-pack>=0.3,<1.6.3",
  "click>=8.1",
  "pydantic>=2.6",
  "structlog>=24.1",
]

[project.optional-dependencies]
ruby = [
  # prism-rb is invoked via subprocess; install separately:
  # gem install prism
]
vec = [
  "sqlite-vec>=0.1.3",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
atlas-aci = "atlas_aci.__main__:cli"

[tool.uv]
# Security floors for transitive dependencies (all pulled in by `mcp`).
# These are *constraints*, not direct deps: they apply only if the package
# is already in the resolved tree, and they stop a future re-lock from
# regressing below a known CVE fix. This keeps the release workflow's Trivy
# HIGH/CRITICAL gate green. Drop an entry once `mcp` floors it for us.
constraint-dependencies = [
  "cryptography>=48.0.1",     # GHSA-537c-gmf6-5ccf — vulnerable OpenSSL in wheels
  "pyjwt>=2.13.0",            # CVE-2026-48526 — auth bypass via forged tokens
  "python-multipart>=0.0.30", # CVE-2026-42561, CVE-2026-53539 — parser DoS
  "starlette>=1.3.1",         # CVE-2026-48818 (SSRF/NTLM), CVE-2026-54283
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_aci"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
