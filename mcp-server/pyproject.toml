[project]
name = "atlas-aci"
version = "3.0.0"
description = "ATLAS bounded Agent-Computer Interface — reference MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

dependencies = [
  # >=1.28.1: CVE-2026-52869, CVE-2026-52870, CVE-2026-59950. <2: the 2.x SDK is a
  # breaking major — an unbounded floor lets a fresh resolve jump straight onto it.
  "mcp>=1.28.1,<2",
  "tree-sitter>=0.23",
  # 1.6.3 ships only a `_native/` subpackage and removed the top-level
  # `tree_sitter_language_pack` module that codegraph.py imports.
  "tree-sitter-language-pack>=0.3,<1.6.3",
  "click>=8.1",
  "pydantic>=2.6",
  "structlog>=24.1",
]

[project.optional-dependencies]
# Reserved for a future Ruby-specialist extra; nothing ships in it today.
# Ruby support is the tree-sitter-language-pack grammar above, same as
# every other language — there is no separate Ruby specialist mode.
ruby = [
]
vec = [
  "sqlite-vec>=0.1.3",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  # Differential oracle for the dependency-free SCIP wire decoder (ACI-S16).
  # Dev-only: the runtime never imports protobuf. The floor must be at least
  # the protoc version that generated tests/fixtures/scip/scip_pb2.py (7.35.1).
  "protobuf>=7.35.1",
]

[project.scripts]
atlas-aci = "atlas_aci.__main__:cli"

[tool.uv]
# Security floors for transitive dependencies (all pulled in by `mcp`).
# These are *constraints*, not direct deps: they apply only if the package
# is already in the resolved tree, and they stop a future re-lock from
# regressing below a known CVE fix. This keeps the release workflow's Trivy
# HIGH/CRITICAL gate green. Drop an entry once `mcp` floors it for us.
constraint-dependencies = [
  "anyio>=4.14.2",            # CVE-2026-63374
  "certifi>=2026.10.18",      # GHSA-6q48-6c7w-9gw2 — removed compromised root CA
  "cryptography>=50.0.0",     # CVE-2026-69247; supersedes GHSA-537c-gmf6-5ccf floor
  "pyjwt>=2.15.1",            # CVE-2026-102268 + GHSA-pxh4-856f-4h89 family; supersedes CVE-2026-48526 floor
  "python-multipart>=0.0.30", # CVE-2026-42561, CVE-2026-53539 — parser DoS
  "starlette>=1.3.1",         # CVE-2026-48818 (SSRF/NTLM), CVE-2026-54283
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_aci"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Official protoc output; committed verbatim as the differential-test oracle.
extend-exclude = ["tests/fixtures/scip/scip_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
