# atlas-aci — pull-request CI (H0, v2.0.0 hardening gate)
#
# Runs the pytest suite, ruff (lint + format), and mypy on every PR against
# `main`. Before this workflow existed, `.github/workflows/` held only the
# tag-triggered `release.yml` — the test suite never ran on a PR, so
# "verified" was unenforceable (spec.md problem statement item 2).
#
# This workflow is one of the three P0 harden-gate greens (AC-H-1, AC-H-2);
# `.github/workflows/harden-gate.yml` is the separate in-tree mechanism that
# blocks augmentation (A1-A5) PRs while these checks are absent or red
# (AC-NEG-6, DIR-3). Branch protection / required status checks are
# defence-in-depth configured by the repo operator — out-of-tree, not
# something this workflow (or the acceptance suite) can assert.
#
# `--frozen` is used throughout: it uses the committed `uv.lock` exactly
# as-is and never rewrites it — the failure mode that already bit this
# project once (a bare `uv run` silently re-locking `atlas-aci` from 0.3.1
# to 0.4.0). `--frozen` does NOT validate that the lock is up to date with
# `pyproject.toml` — that is `--locked`'s job, not this flag's (verified:
# `uv sync --locked` exits non-zero and reports "needs to be updated" when
# they disagree; `--frozen` exits 0 regardless). We deliberately do NOT use
# `--locked` here yet: `mcp-server/uv.lock` is *currently* stale relative to
# `pyproject.toml` (the atlas-aci package version pin — AC-REL-3, a real,
# separately-tracked defect owned by phase P3's release-prep), so switching
# to `--locked` today would fail every PR's CI run on an unrelated,
# already-known issue. `--frozen` is the correct choice until AC-REL-3
# lands; AC-REL-3 itself should add a `--locked` (or `uv lock --check`) step
# once the lock is current, so lock/pyproject drift can never silently ship
# again.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest / ruff / mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "mcp-server/pyproject.toml"

      - name: Sync dependencies (frozen — never silently re-locks)
        run: uv sync --frozen --extra dev

      - name: pytest
        run: uv run --frozen pytest -q

      - name: ruff check
        run: uv run --frozen ruff check src/ tests/

      - name: ruff format --check
        run: uv run --frozen ruff format --check src/ tests/

      - name: mypy
        run: uv run --frozen mypy src/
